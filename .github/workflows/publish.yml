name: Publish to PyPI

# Publishing is irreversible on PyPI — a filename cannot be re-uploaded under
# the same version, and a version cannot be deleted. So this workflow only
# runs on an explicit version tag, and only after the tag already exists on
# the release commit.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # trusted publishing (OIDC) — no long-lived token needed
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python3 -m pip install --upgrade pip build twine
          python3 -m build

      - name: Check the distributions
        # twine check catches README rendering problems, which is what PyPI
        # shows on the package page.
        run: python3 -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      # Trusted publishing (OIDC) needs a matching publisher registered on the
      # PyPI side: owner `Gary1020-byte`, repo `ntu-cool-cli`, workflow
      # `publish.yml`. Without it this step fails with
      # `invalid-publisher: valid token, but no corresponding publisher` --
      # which is exactly what happened to v1.3.1 and v1.3.2. Those two were
      # uploaded by hand; this workflow was never exercised successfully.
      #
      # If the publisher is not set up, upload the built wheel and sdist by
      # hand instead of re-running this workflow: a filename cannot be
      # re-uploaded under the same version, so a failed run after a partial
      # upload is a mess to unpick.
