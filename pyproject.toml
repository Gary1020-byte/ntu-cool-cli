[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ntu-cool-cli"
version = "1.3.0"
description = "Read-only CLI for NTU Cool: course announcements, course files, handouts, and submission status."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = [
  "ntu", "cool", "ceiba", "cli", "announcements", "course", "files",
  "homework", "handout", "student", "scraper", "read-only",
]
dependencies = ["requests>=2.28"]

[project.scripts]
ntu-cool-cli = "ntu_fetch:main"

[tool.setuptools]
py-modules = ["ntu_fetch"]
package-dir = { "" = "scripts" }
