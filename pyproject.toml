[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ntu-course-announcements"
version = "1.0.0"
description = "Read-only fetcher for NTU Cool course announcements and course files."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = ["ntu", "cool", "ceiba", "announcements", "course", "student"]
dependencies = ["requests>=2.28"]

[project.scripts]
ntu-cool = "ntu_fetch:main"

[tool.setuptools]
py-modules = ["ntu_fetch"]
package-dir = { "" = "scripts" }
